# Rebuilds the pile of offers every six hours and publishes the site to GitHub Pages.
# Also runs on a push to master that changes the app or the builder, and by hand.
name: pile
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['app/**', 'builder/**', 'catalogues/**', 'package.json', '.github/workflows/pile.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node builder/build-pile.mjs --out site-data --explain
      - run: node builder/build-site.mjs --data site-data --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
