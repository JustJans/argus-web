# ➤ How often each kind of source is read, and how hard the crawler may work. The crawler runs
# ➤ every hour and takes the sources whose last pass is older than their cadence, so these
# ➤ numbers are the whole schedule: raise a cadence to be gentler, lower it to be fresher.
# ➤ One pass a day over every source is what the site needs: it is what tells a vacancy that
# ➤ has closed from one that is still open, and it brings the new ones. Reading a source four
# ➤ times a day brought the same adverts four times and left less of the server for the sites
# ➤ that cost a sitemap and its pages.

cadence_h:
  default: 24

# ➤ What one hourly run may spend.
budget:
  minutes: 55           # ➤ no source is started after minute 50
  pages_a_run: 12000    # ➤ vacancy pages fetched in one run, across every site (a ceiling, not a target)
  pages_a_site: 200     # ➤ per site and pass
  renders_a_run: 200    # ➤ listing pages drawn by a browser (phase 5)
  new_a_run: 3000       # ➤ sources never read before, so a discovery of thousands does not starve the day
  lanes: 16
  in_flight:            # ➤ per group, because an ATS serves every board from one host
    default: 2
    careers: 12
    feeds: 2
    via: 1
    browser: 2

# ➤ A source that fails waits this long before the next try, then is parked.
backoff_h: [6, 24, 48]
park_after_fails: 14
